name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: packages/screens

      - name: Checkout @roj234
        uses: actions/checkout@v6
        with:
          path: packages/@roj234
          repository: roj234/unconscious

      - name: Setup monorepo root
        run: |
          echo '{ "private": true, "workspaces": ["packages/*", "packages/@roj234/*"] }' > package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        working-directory: packages/screens

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/screens/dist

  release:
    permissions:
      contents: write
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: release-files

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || format('v{0}', github.run_number) }}
          name: ${{ github.event.inputs.tag_name || format('b{0}', github.run_number) }}
          body: |
            ${{ github.event.head_commit.message }}
          files: |
            release-files/*
          draft: false
          prerelease: false